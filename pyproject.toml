[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "airfare-monitor"
version = "0.6.24"
description = "Personal airfare monitoring with a Windows desktop companion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "airportsdata>=20260803",
  "DrissionPage>=4,<5",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.8,<7",
  "keyring>=25,<26",
]
build = [
  "PyInstaller>=6,<7",
]

[project.scripts]
airfare-monitor = "airfare_monitor.cli:main"

[project.gui-scripts]
airfare-monitor-gui = "airfare_monitor.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
