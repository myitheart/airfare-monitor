# Copy to routes.yaml and replace all placeholders.
# Airport fields use IATA three-letter airport codes, not airline codes.
legs:
  - id: leg-1
    enabled: true
    origin_airport_iata: AAA
    origin_name_zh: 出发地名称
    destination_airport_iata: BBB
    destination_name_zh: 到达地名称
    departure_date: "2026-10-01"
    etd_window:
      start: "00:00"
      end: "23:59"
    direct_only: true
    expected_total_price_cny: 1500
    top_n: 10
    adult_count: 1
    child_count: 0
    cabin_class: economy
    # auto: 中国大陆境内走同程，其余走去哪儿；也可显式填 domestic/international。
    market: auto
    # Optional exact schedules to call out separately in every email.
    preferred_schedules:
      - label: 出发地 → 到达地
        departure_time: "07:25"
        arrival_time: "13:00"
        arrival_day_offset: 0
        departure_tolerance_minutes: 60
        arrival_tolerance_minutes: 60
        origin_airport_iata: PVG
        destination_airport_iata: KUL

